# ==============================================================================
# VM 4: Dedicated PostgreSQL 16 Deployment (Deploy this on VM 4)
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: ctf_postgres_vm4
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ctf_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecretCtfPass123!}
      POSTGRES_DB: ${POSTGRES_DB:-ctf_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Exposes 5432 to the internal Proxmox subnet (accessible only to VM 3 Core Backend)
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ctf_admin} -d ${POSTGRES_DB:-ctf_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

